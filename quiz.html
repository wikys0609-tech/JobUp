<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JobUp</title>
<link href="https://fonts.googleapis.com/css2?family=Gmarket+Sans:wght@300;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="scr on" id="quiz">
  <div class="q-top">
    <button class="qcl" onclick="location.href='index.html'">✕</button>
    <div class="qpw"><div class="qpf lan" id="qpf" style="width:20%"></div></div>
    <div class="q-hearts"><span class="ht" id="h1">❤️</span><span class="ht" id="h2">❤️</span><span class="ht" id="h3">❤️</span></div>
  </div>
  <!-- 과목 탭 -->
  <div class="q-subj-tabs" id="qSTabs">
    <div class="q-stab lan on" onclick="pickSubj('lan')">🔤 언어</div>
    <div class="q-stab num" onclick="pickSubj('num')">🔢 수리</div>
    <div class="q-stab rea" onclick="pickSubj('rea')">🔀 추리</div>
  </div>
  <div class="q-badge" id="qBadge">🔤 언어 (Language) · 문제 <span id="qN">1</span>/3</div>
  <div class="q-card"><div class="q-type lan" id="qType">명제 추론</div><p class="q-text" id="qTxt"></p></div>
  <div class="q-pass" id="qPass" style="display:none"></div>
  <div class="q-opts" id="qOpts"></div>
  <div class="rbanner" id="rb"><p class="rb-t" id="rb-t"></p><p class="rb-b" id="rb-b"></p></div>
  <div class="q-foot"><button class="qsub lan" id="qsub" disabled onclick="submitQ()">확인</button></div>
</div>

<div class="g-tip" id="gTip"></div><div class="unlock-toast" id="uToast"></div>
<script src="js/app.js"></script>
</body>
</html>
