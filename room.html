          <!-- 그림자 필터 -->

          </filter>
          <filter id="glowP">
            <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#9D7FFF" flood-opacity=".7"/>
          </filter>
          <filter id="glowY">
            <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#F4C430" flood-opacity=".7"/>
          </filter>

             isoX(x,y) = cx + (x-y)*tw/2
             isoY(x,y) = cy + (x+y)*th/2 - z*hz
             tw=56, th=28, hz=24, cx=200, cy=220
        -->

          <polygon points="144,262 172,276 144,290 116,276" fill="#1e2238" stroke="#252a45" stroke-width=".5"/>

          <polygon points="292,242 300,238 304,240 296,244" fill="#4a3010" stroke="#3a2408" stroke-width=".6"/>
          <polygon points="292,242 296,244 296,254 292,252" fill="#3a2408" stroke="#2e1c06" stroke-width=".6"/>
          <polygon points="296,244 304,240 304,250 296,254" fill="#3e2a0a" stroke="#2e1c06" stroke-width=".6"/>
          <!-- 흙 -->
          <polygon points="293,243 299,240 303,242 297,245" fill="#2a1a06" stroke="#1e1204" stroke-width=".4"/>
          <!-- 줄기 -->
          <line x1="298" y1="243" x2="296" y2="234" stroke="#2a5a18" stroke-width="1.2"/>
          <line x1="298" y1="243" x2="302" y2="233" stroke="#2a5a18" stroke-width="1.2"/>
          <!-- 잎들 -->
          <ellipse cx="294" cy="231" rx="5" ry="3" fill="#27a848" opacity=".9" transform="rotate(-30,294,231)"/>
          <ellipse cx="303" cy="229" rx="5" ry="3" fill="#1e8838" opacity=".9" transform="rotate(20,303,229)"/>
          <ellipse cx="297" cy="227" rx="4" ry="3" fill="#27D98A" opacity=".8" transform="rotate(-10,297,227)"/>
          <ellipse cx="300" cy="225" rx="4" ry="2.5" fill="#1e8838" opacity=".7" transform="rotate(15,300,225)"/>
        </g>

        <!-- ── 스탠드 조명 (책상 왼쪽) ── -->
        <g id="lamp" class="iso-item" onclick="isoTip(event,'스탠드 조명 💡','Premium 구독자 전용 아이템')" filter="url(#glowY)">
          <!-- 받침 -->
          <polygon points="170,246 175,243 177,244 172,247" fill="#3a3010" stroke="#4a4018" stroke-width=".5"/>
          <polygon points="170,246 172,247 172,250 170,249" fill="#2e2408" stroke="#3a3010" stroke-width=".5"/>
          <!-- 기둥 -->
          <line x1="173" y1="247" x2="171" y2="228" stroke="#6a6020" stroke-width="1.5"/>
          <!-- 팔 -->
          <line x1="171" y1="228" x2="181" y2="222" stroke="#6a6020" stroke-width="1.2"/>
          <!-- 갓 -->
          <polygon points="177,218 187,213 189,214 179,219" fill="#c8a020" stroke="#a07818" stroke-width=".6"/>
          <polygon points="177,218 179,219 179,224 177,223" fill="#a07818" stroke="#8c6810" stroke-width=".6"/>
          <polygon points="179,219 189,214 189,219 179,224" fill="#b08820" stroke="#8c6810" stroke-width=".6"/>
          <!-- 빛 반사 (노란 원형) -->
          <ellipse cx="183" cy="224" rx="10" ry="5" fill="#F4C430" opacity=".07" transform="rotate(-25,183,224)"/>
        </g>

        <!-- ── 트로피 (책꽂이 위) ── -->
        <g id="trophy" class="iso-item" onclick="isoTip(event,'금빛 트로피 🏆','리그 1위 달성 보상')" filter="url(#glowY)">
          <!-- 받침 -->
          <polygon points="119,211 124,208 126,209 121,212" fill="#8c6818" stroke="#7a5810" stroke-width=".5"/>
          <polygon points="119,211 121,212 121,216 119,215" fill="#6a5010" stroke="#5a4008" stroke-width=".5"/>
          <!-- 기둥 -->
          <polygon points="120,209 123,207 123,211 120,213" fill="#a07820" stroke="#8c6818" stroke-width=".4"/>
          <!-- 컵 바디 -->
          <polygon points="118,201 127,196 130,198 121,203" fill="#F4C430" stroke="#c8a020" stroke-width=".5"/>
          <polygon points="118,201 121,203 121,210 118,208" fill="#c8a020" stroke="#a07818" stroke-width=".5"/>
          <polygon points="121,203 130,198 130,205 121,210" fill="#d4ac28" stroke="#a07818" stroke-width=".5"/>
          <!-- 핸들 -->
          <path d="M118,203 Q114,205 115,208 Q116,211 118,209" fill="none" stroke="#c8a020" stroke-width=".8"/>
          <path d="M130,198 Q134,200 133,203 Q132,206 130,205" fill="none" stroke="#c8a020" stroke-width=".8"/>
          <!-- 별 -->
          <text x="124" y="205" font-size="4" fill="#fff" text-anchor="middle" opacity=".9">★</text>
        </g>

        <!-- ── 러그/매트 (바닥 앞쪽) ── -->
        <polygon points="108,278 148,257 175,272 135,293" fill="#1e2848" stroke="#27305a" stroke-width=".8" opacity=".8"/>
        <!-- 러그 패턴 -->
        <polygon points="120,274 138,265 151,272 133,281" fill="none" stroke="#2e3d6a" stroke-width=".7" opacity=".5"/>

        <!-- ── 파티클 / 환경광 효과 ── -->
        <circle cx="290" cy="130" r="1.5" fill="#F4C430" opacity=".25"/>
        <circle cx="310" cy="145" r="1" fill="#4B96FF" opacity=".2"/>
        <circle cx="150" cy="90" r="1.2" fill="#27D98A" opacity=".2"/>
        <circle cx="130" cy="105" r="0.8" fill="#9D7FFF" opacity=".3"/>

        <!-- ── 전면 테두리 그라디언트 (깊이감) ── -->
        <defs>
          <linearGradient id="vignette" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#060810" stop-opacity=".4"/>
            <stop offset="40%" stop-color="#060810" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <rect width="400" height="340" fill="url(#vignette)" pointer-events="none"/>
      </svg>
    </div>

    <!-- 아이소메트릭 레이블 안내 -->
    <div style="display:flex;gap:8px;padding:8px 20px 2px;flex-wrap:wrap">
      <span style="font-size:11px;color:var(--tx3)">탭하면 아이템 정보 확인</span>
      <span style="font-size:11px;color:var(--pur)">● 보라 테두리 = 장착중</span>
      <span style="font-size:11px;color:var(--gld)">● 금색 빛 = 특별 보상</span>
    </div>

    <!-- 아이템 서랍 -->
    <div class="item-draw" style="margin:8px 20px 0">
      <div class="draw-tabs">
        <div class="dtab on" onclick="dTab(this,'furn')">가구</div>
        <div class="dtab" onclick="dTab(this,'deco')">벽 데코</div>
        <div class="dtab" onclick="dTab(this,'spec')">특별 아이템</div>
      </div>
      <div class="item-grid" id="itemGrid">
        <div class="ic eq" onclick="toast('기본 의자 — 현재 배치됨 ✓')"><div class="ic-em">🪑</div><div class="ic-nm">기본 의자</div></div>
        <div class="ic eq" onclick="toast('책꽂이 — 현재 배치됨 ✓')"><div class="ic-em">📚</div><div class="ic-nm">영어 책꽂이</div></div>
        <div class="ic eq" onclick="toast('스탠드 조명 — 현재 배치됨 ✓')"><div class="ic-em">💡</div><div class="ic-nm">스탠드</div></div>
        <div class="ic locked"><div class="ic-em">🪞</div><div class="ic-nm">거울<br><small>Lv.5</small></div><span class="ic-lk">🔒</span></div>
        <div class="ic" onclick="toast('소파 — 탭하면 방에 배치됩니다')"><div class="ic-em">🛋️</div><div class="ic-nm">소파</div></div>
        <div class="ic locked"><div class="ic-em">🛏️</div><div class="ic-nm">침대<br><small>30일 연속</small></div><span class="ic-lk">🔒</span></div>
        <div class="ic locked"><div class="ic-em">🖥️</div><div class="ic-nm">외장 모니터<br><small>Lv.7</small></div><span class="ic-lk">🔒</span></div>
        <div class="ic locked"><div class="ic-em">🪴</div><div class="ic-nm">큰 화분<br><small>Lv.5</small></div><span class="ic-lk">🔒</span></div>
      </div>
    </div>

    <!-- 잠금 해제 조건 안내 -->
    <div style="margin:10px 20px 0;background:var(--s1);border:1px solid var(--b1);border-radius:var(--rs);padding:13px 15px">
      <p style="font-size:12px;font-weight:700;color:var(--pur);margin-bottom:8px">🔒 다음 아이템을 해제하려면</p>
      <div style="display:flex;flex-direction:column;gap:5px">
        <p style="font-size:12px;color:var(--tx2)">🔑 언어 Lv.5 달성 → <strong style="color:var(--tx1)">거울</strong></p>
        <p style="font-size:12px;color:var(--tx2)">🔑 30일 연속 학습 → <strong style="color:var(--tx1)">침대</strong></p>
        <p style="font-size:12px;color:var(--tx2)">🔑 수리 Lv.7 달성 → <strong style="color:var(--tx1)">외장 모니터</strong></p>
      </div>
    </div>
  </div>
</div>

<div class="g-tip" id="gTip"></div><div class="unlock-toast" id="uToast"></div>
<script src="js/app.js"></script>
</body>
</html>
